spring.application.name=demo
server.port=${PORT:8080}
server.address=0.0.0.0

# MongoDB Configuration
# Uses SPRING_DATA_MONGODB_URI environment variable (for Render / MongoDB Atlas), falls back to local
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/mybusiness_db}

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
